<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ander Mena · Full Stack Developer</title>
  <meta name="description" content="Estudiante de Ingeniería Informática (Ingeniería del Software) en la UPV/EHU. Full Stack Developer en formación.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://andermena23.github.io/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Ander Mena">
  <meta property="og:title" content="Ander Mena · Full Stack Developer">
  <meta property="og:description" content="Estudiante de Ingeniería Informática (Ingeniería del Software) en la UPV/EHU. Full Stack Developer en formación.">
  <meta property="og:url" content="https://andermena23.github.io/">
  <meta property="og:image" content="https://github.com/andermena23.png?size=460">
  <meta property="og:locale" content="es_ES">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ander Mena",
    "url": "https://andermena23.github.io/",
    "image": "https://github.com/andermena23.png?size=460",
    "sameAs": ["https://github.com/andermena23"],
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Universidad del País Vasco (UPV/EHU)"
    }
  }
  </script>

  <!-- Aplica el tema guardado antes del primer pintado para evitar parpadeo -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main" data-bind="ui.skip">Saltar al contenido</a>

  <header class="site-header">
    <div class="container">
      <!-- Los controles se muestran cuando el JS ha cargado -->
      <div class="toolbar" hidden>
        <button type="button" class="icon-btn" id="lang-toggle"></button>
        <button type="button" class="icon-btn" id="theme-toggle"><span aria-hidden="true">◐</span></button>
      </div>

      <div class="profile">
        <img class="profile__photo" src="https://github.com/andermena23.png?size=224" alt="" width="112" height="112">
        <div>
          <h1 class="profile__name" data-bind="meta.name">Ander Mena</h1>
          <p class="profile__title" data-bind="meta.title">Full Stack Developer en formación</p>
          <p class="profile__location" data-bind="meta.location"></p>
          <a class="btn" id="cv-download" download hidden></a>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <section class="section" id="profile" data-section="summary" aria-labelledby="profile-title" hidden>
        <h2 class="section__title" id="profile-title">Perfil</h2>
        <div data-content></div>
      </section>

      <section class="section" id="experience" data-section="experience" aria-labelledby="experience-title" hidden>
        <h2 class="section__title" id="experience-title">Experiencia</h2>
        <div class="timeline" data-content></div>
      </section>

      <section class="section" id="projects" data-section="projects" aria-labelledby="projects-title" hidden>
        <h2 class="section__title" id="projects-title">Proyectos</h2>
        <div data-content></div>
      </section>

      <section class="section" id="education" data-section="education" aria-labelledby="education-title" hidden>
        <h2 class="section__title" id="education-title">Formación</h2>
        <div data-content></div>
      </section>

      <section class="section" id="skills" data-section="skills" aria-labelledby="skills-title" hidden>
        <h2 class="section__title" id="skills-title">Habilidades</h2>
        <div data-content></div>
      </section>

      <section class="section" id="languages" data-section="languages" aria-labelledby="languages-title" hidden>
        <h2 class="section__title" id="languages-title">Idiomas</h2>
        <div data-content></div>
      </section>

      <section class="section" id="certifications" data-section="certifications" aria-labelledby="certifications-title" hidden>
        <h2 class="section__title" id="certifications-title">Certificaciones</h2>
        <div data-content></div>
      </section>

      <section class="section" id="contact" data-section="contact" aria-labelledby="contact-title" hidden>
        <h2 class="section__title" id="contact-title">Contacto</h2>
        <div data-content></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-year>2026</span> Ander Mena</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
